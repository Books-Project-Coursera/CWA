# =====================================================================
# Strategy 2 - Object Detection config (Ultralytics YOLO + Pascal VOC)
#
# Cách dùng:
#   python main_detection.py train --config configs/detection_voc.yaml
# Mọi key ở đây đều override được qua CLI (vd: --model, --epochs, --batch).
# Chi tiết: README_DETECTION.md
# =====================================================================

# --------------------------- Model ---------------------------
# KHÔNG chốt cứng version YOLO nào làm mặc định — bạn TỰ SET giá trị này.
# Nhận mọi giá trị mà ultralytics.YOLO() nhận, đổi version = sửa đúng 1 dòng:
#   - Pretrained weights : yolov8n.pt | yolo11n.pt | yolov5nu.pt | yolov8s.pt ...
#   - Custom weights     : path/to/your_best.pt
#   - Train from scratch : yolov8n.yaml (hoặc .yaml kiến trúc custom của bạn)
model: null   # <-- ĐẶT MODEL CỦA BẠN Ở ĐÂY (hoặc truyền --model khi chạy)

# --------------------------- Dataset ---------------------------
# "VOC.yaml" = Pascal VOC built-in của Ultralytics, TỰ ĐỘNG DOWNLOAD lần đầu
# (https://docs.ultralytics.com/datasets/detect/voc). Muốn dùng data đã tải
# sẵn / data custom thì trỏ tới file data.yaml của bạn:
#   data: /path/to/custom_voc/data.yaml
#
# ⚠️ LƯU Ý QUAN TRỌNG (val ≡ test):
# Trong VOC.yaml của Ultralytics, split `val` và `test` là MỘT — cả hai cùng
# trỏ tới VOC2007 test (4952 ảnh); train = trainval 2007+2012 (16551 ảnh).
# KHÔNG có validation set độc lập tách khỏi test.
# → Metrics "val" in ra trong lúc train thực chất đo trên VOC2007 test.
# → Khi báo cáo số liệu phải ghi rõ điều này (tránh hiểu nhầm là đã có
#   held-out val riêng; xem thêm README_DETECTION.md).
data: VOC.yaml

# --------------------------- Training ---------------------------
epochs: 100
imgsz: 640
batch: 16        # -1 = auto batch (Ultralytics tự chọn theo VRAM)
device: null     # null = auto (GPU nếu có); "0" | "0,1" | "cpu" đều hợp lệ
workers: 8
seed: 1          # nhất quán với Config.SEEDS[0] của nhánh classification
optimizer: auto  # auto | SGD | Adam | AdamW | ...
lr0: 0.01
lrf: 0.01
patience: 100    # early stopping của Ultralytics (số epoch không cải thiện)
pretrained: true
cache: false
resume: false

# Truyền thêm bất kỳ train-arg nào khác của Ultralytics mà KHÔNG cần sửa code
# (https://docs.ultralytics.com/modes/train/#train-settings), ví dụ:
#   extra_train_args:
#     cos_lr: true
#     mosaic: 1.0
#     close_mosaic: 10
extra_train_args: {}

# --------------------------- Output ---------------------------
project: results/detection   # thư mục gốc output (theo pattern results/ của repo)
name: null                   # null = Ultralytics tự đánh số (train, train2, ...)
exist_ok: false

# --------------------------- Evaluation ---------------------------
eval:
  # split: null = dùng đúng split mặc định của data.yaml khi model.val() ("val").
  # Có thể set "val" | "test" | "train". Với VOC.yaml built-in thì val ≡ test
  # nên chọn "val" hay "test" đều cho cùng một tập ảnh (VOC2007 test).
  split: null
  conf: null   # confidence threshold; null = mặc định Ultralytics khi val (0.001)
  iou: null    # NMS IoU threshold; null = mặc định Ultralytics

# --------------------------- Excel export ---------------------------
excel:
  # null = tự lưu vào <run_dir>/detection_results.xlsx
  # (2 sheet: Summary + PerEpoch — xem detection/export_metrics.py)
  output: null

# ------------------- Edge AI export (OPTIONAL) -------------------
# Hook xuất model sau train bằng model.export() của Ultralytics — phục vụ
# hướng Edge AI. TẮT MẶC ĐỊNH; bật enabled: true (hoặc --export-after-train).
export:
  enabled: false
  format: onnx     # onnx | engine (TensorRT) | openvino | tflite | ...
  half: false      # FP16 (hữu ích cho TensorRT/edge)
  imgsz: null      # null = dùng imgsz phía trên
  dynamic: false
  simplify: true   # đơn giản hoá graph ONNX
  device: null     # export TensorRT cần GPU → set "0" nếu format: engine
